org.gradle.caching=true
org.gradle.configuration-cache=true
# Bound concurrent compilers and browser runners to keep peak memory predictable.
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
android.useAndroidX=true
version=0.1.0-alpha01
