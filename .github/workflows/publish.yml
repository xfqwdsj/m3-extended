name: Publish
on:
  release:
    types: [ published ]
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set gradlew executable
        run: chmod +x gradlew
      - name: Set up node
        run: |
          ./gradlew kotlinNodeJsSetup kotlinWasmNodeJsSetup kotlinNpmInstall kotlinWasmNpmInstall
      - name: Run tests
        run: ./gradlew allTests
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --continue
      - name: Publish to Maven Central
        run: |
          ./gradlew publishToMavenCentral
    env:
      ORG_GRADLE_PROJECT_publishSigningMode: inMemory
      ORG_GRADLE_PROJECT_gitHubPackagesUsername: xfqwdsj
      ORG_GRADLE_PROJECT_gitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}

  demo-artifacts:
    name: Demo artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up packaging JDK
        id: packaging-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          java-package: jdk+jmods
          cache-jdk: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v3
      - name: Build Linux demo artifacts
        if: runner.os == 'Linux'
        run: ./gradlew :demo-android:packageReleaseArtifacts :demo-desktop:packageReleaseArtifacts "-PdesktopJavaHome=${{ steps.packaging-java.outputs.path }}"
      - name: Build macOS demo artifacts
        if: runner.os == 'macOS'
        run: ./gradlew :demo-desktop:packageReleaseArtifacts "-PdesktopJavaHome=${{ steps.packaging-java.outputs.path }}" :demo-macos:packageReleaseArtifacts
      - name: Build Windows demo artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :demo-desktop:packageReleaseArtifacts "-PdesktopJavaHome=${{ steps.packaging-java.outputs.path }}"
      - name: Upload artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(demo-*/build/release-assets/*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts were staged" >&2
            exit 1
          fi
          gh release upload "$TAG" "${artifacts[@]}" --clobber
