name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            tasks: jvmTest testAndroidHostTest test jsTest wasmJsTest
          - platform: apple
            os: macos-latest
            tasks: macosArm64Test iosSimulatorArm64Test
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set gradlew executable
        run: chmod +x gradlew
      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v4
      - name: Set up node
        if: runner.os == 'Linux'
        run: |
          ./gradlew kotlinNodeJsSetup kotlinWasmNodeJsSetup kotlinNpmInstall kotlinWasmNpmInstall
      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew ${{ matrix.tasks }} --continue
      - name: Run Apple tests
        if: runner.os == 'macOS'
        run: ./gradlew ${{ matrix.tasks }} --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: '**/build/reports/tests/**'
          retention-days: 7
